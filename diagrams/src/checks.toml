# The sources of R1's band 5, "What has been checked of the formal proof": the announcements and reports of the
# checks run on the formal proof, one entry each. This is the diagram's own data, like papers.toml: the blueprint
# and the mirror carry none of it. A card of band 5 paraphrases these pages, and the build cannot fetch them, so
# each entry records what was read: `read`, the day; `from` and `to`, the first and last words of the passage the
# cards rest on; and `sha256`, the hash of that passage as tools/check-sources.py extracts it (the page's text with
# its markup removed and its whitespace collapsed, from `from` to `to` inclusive). The build fails if an entry's
# sha256 is not the one src/bp.py records in CHECKS_SHA256, so that a new reading of a page, recorded here by
#     python3 tools/check-sources.py --update
# stops the build until the cards are re-read against it. Without --update the tool only reports what changed.
# Each url is a link out of R1, allowed by the build's link check alongside the pinned commits and the papers.

