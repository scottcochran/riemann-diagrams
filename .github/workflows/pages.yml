# Publish a release's posters to GitHub Pages, so a reader can open one in the browser, served as image/svg+xml,
# rather than in GitHub's file viewer. The site holds the tag's diagrams/*.svg and diagrams/map/*.svg at the paths
# they have in the tree, the release's pins.json, and an index: diagrams/README.md at the tag, rendered, above the
# list of the release's posters from the two manifests. Before it deploys,
# the job checks the files against the release's SHA256SUMS, so the site is the release and nothing else. Pages
# holds one release at a time; the others stay on their release pages.
#
# release.yml calls this with each new tag. Run it by hand (Actions, pages, Run workflow, from main) with an
# existing tag to publish that release: the first one before the next tag, or an older one back. Only the custodian
# may.
#
# Needs Pages set to "GitHub Actions" in the repository's settings, and the github-pages environment to allow
# main (for a run by hand) and tags matching v* (for a call from release.yml).
#
# Two jobs, as GitHub's own Pages workflow has them: build stages the site and uploads it, deploy publishes it.
# With both in one job, deploy-pages listed the artifact right after the upload and found none once the
# artifact had grown to 5 MB with the fonts and the Phase 6 posters (three runs of v0.2.0, 2026.11.22); a job
# boundary waits for the artifact to be registered.
name: pages

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, e.g. v0.1.1
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: The tag is a release, and the run is the custodian's
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          [ "$GITHUB_ACTOR" = scottcochran ] || { echo "pages: only the custodian publishes"; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "pages: $TAG is not vMAJOR.MINOR.PATCH"; exit 1; }
          gh release view "$TAG" --json tagName -q .tagName >/dev/null || { echo "pages: $TAG has no release"; exit 1; }
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Stage the site
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag=$TAG
          mkdir -p site/diagrams/map
          cp diagrams/*.svg site/diagrams/
          cp diagrams/map/*.svg site/diagrams/map/
          touch site/.nojekyll
          gh release download "$tag" -p pins.json -p SHA256SUMS -D release
          # the site must be the release: every SVG at the tag, under its release name, and pins.json, as summed
          mkdir check
          cp diagrams/*.svg check/
          cp diagrams/map/*.svg check/
          cp release/pins.json release/SHA256SUMS check/
          (cd check && sha256sum --strict -c SHA256SUMS)
          [ "$(ls check/*.svg | wc -l)" = "$(grep -c '\.svg$' release/SHA256SUMS)" ] || { echo "pages: the tag has SVGs the release does not"; exit 1; }
          cp release/pins.json site/
          python3 - "$tag" > site/index.html <<'PY'
          import html, json, re, subprocess, sys
          tag = sys.argv[1]
          repo = "https://github.com/scottcochran/riemann-diagrams"
          # The page is diagrams/README.md at the tag, rendered by GitHub's Markdown API, above the list of the
          # release's posters from the two manifests. The README's links are relative to diagrams/: a poster's
          # resolves on the site under diagrams/; anything else (a Markdown file, a directory, the NOTICE) goes to
          # GitHub at the tag, so that nothing on the page lands on a 404.
          md = open("diagrams/README.md", encoding="utf-8").read()
          # The home page is the README as it is, but for one move: the line on about.md, if the README has one,
          # goes to the foot. It is found by its first words; two such paragraphs fail the build.
          paras = md.split("\n\n")
          about = [p for p in paras if p.startswith("[about.md]")]
          if len(about) > 1:
              sys.exit("pages: more than one paragraph of diagrams/README.md starts with [about.md]")
          if about:
              paras.remove(about[0]); paras.append(about[0])
          md = "\n\n".join(paras)
          def target(m):
              t = m.group(1)
              if re.match(r"(https?:|/|#|mailto:)", t):
                  return m.group(0)
              if t.endswith(".svg"):
                  return f"](diagrams/{t})"
              path = re.sub(r"^(\.\./)+", "", t) if t.startswith("../") else f"diagrams/{t}"
              kind = "tree" if path.endswith("/") else "blob"
              return f"]({repo}/{kind}/{tag}/{path.rstrip('/')})"
          md = re.sub(r"\]\(([^)\s]+)\)", target, md)
          # mode=markdown renders as a README is rendered, a newline a space; gfm is the comment mode, in which
          # every newline is a hard break, and the README is wrapped at 80 columns.
          body = subprocess.run(["gh", "api", "-X", "POST", "markdown", "-f", "mode=markdown", "-f", "text=" + md],
                                capture_output=True, text=True, check=True).stdout
          release = (f'<p class="release">The posters of release <a href="{repo}/releases/tag/{tag}">{tag}</a>, served '
                     f'as SVG: open one and zoom in.</p>')
          body = body.replace("</h1>", "</h1>\n" + release, 1)
          def fmt(t):
              return re.sub(r"`([^`]+)`", r"<code>\1</code>", html.escape(t))
          out = ['<!doctype html>', '<html lang="en">', '<meta charset="utf-8">',
                 '<meta name="viewport" content="width=device-width, initial-scale=1">',
                 f'<title>Riemann Hypothesis proof diagrams, {tag}</title>',
                 '<style>body{font:16px/1.5 -apple-system,Helvetica,Arial,sans-serif;max-width:56rem;margin:2rem auto;'
                 'padding:0 1rem;color:#1f2328;background:#fff} li{margin:.4rem 0} h1,h2,h3{line-height:1.25}'
                 'img{max-width:100%;height:auto}'
                 'code{font-size:.9em;background:#f3f4f6;padding:.1em .3em;border-radius:4px}'
                 'pre{background:#f3f4f6;padding:.8rem;overflow:auto} pre code{background:none;padding:0}'
                 'table{border-collapse:collapse;display:block;overflow:auto}'
                 'th,td{border:1px solid #d0d7de;padding:.3rem .6rem;vertical-align:top;text-align:left}'
                 '.release{border-left:4px solid #d0d7de;padding-left:.8rem}'
                 '@media (prefers-color-scheme:dark){body{background:#0d1117;color:#e6edf3} a{color:#4493f8}'
                 'code,pre{background:#161b22} th,td,.release{border-color:#30363d}}</style>',
                 body, '<hr>', f'<h2>The posters of {tag}</h2>']
          for path, heading, prefix in (("diagrams/manifest.json", "The reader set", "diagrams/"),
                                        ("diagrams/map/manifest.json", "The map set (nothing quoted)", "diagrams/map/")):
              out.append(f"<h3>{heading}</h3>")
              out.append("<ul>")
              for pid, p in sorted(json.load(open(path, encoding="utf-8")).items()):
                  out.append(f'<li><a href="{prefix}{p["file"]}">{pid}</a>: {fmt(p["title"])}</li>')
              out.append("</ul>")
          print("\n".join(out))
          PY
          find site -type f | sort
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5     # needs the pages permission, which only this job has
      - id: deploy
        uses: actions/deploy-pages@v5
